[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jesko"
version = "0.1.0"
description = "Windows-first local notification companion for AI coding agents"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jesko = "jesko.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
